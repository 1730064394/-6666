<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kali Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-panel: #161b22;
            --bg-input: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-green: #3fb950;
            --accent-blue: #58a6ff;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 28px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-bar {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .tool-count {
            background: var(--bg-input);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            color: var(--accent-blue);
        }

        .tools-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .tool-category {
            margin-bottom: 12px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .category-header:hover {
            background: var(--bg-input);
        }

        .category-icon {
            font-size: 18px;
        }

        .category-name {
            flex: 1;
            font-size: 13px;
            font-weight: 600;
        }

        .category-count {
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--bg-dark);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .category-description {
            font-size: 11px;
            color: var(--text-secondary);
            padding-left: 36px;
            margin-bottom: 4px;
        }

        .tool-items {
            padding-left: 12px;
        }

        .tool-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .tool-item:hover {
            background: var(--bg-dark);
            border-color: var(--accent-blue);
            transform: translateX(4px);
        }

        .tool-item.selected {
            border-color: var(--accent-green);
            background: rgba(63, 185, 80, 0.1);
        }

        .tool-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .tool-desc {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .tool-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--accent-green);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal-output {
            flex: 1;
            background: #0a0e14;
            padding: 20px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .output-line {
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 2px;
        }

        .output-line.command {
            color: var(--accent-green);
        }

        .output-line.error {
            color: var(--accent-red);
        }

        .output-line.info {
            color: var(--accent-blue);
        }

        .timestamp {
            color: var(--text-secondary);
            font-size: 11px;
        }

        .input-area {
            background: var(--bg-panel);
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .prompt {
            color: var(--accent-green);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
        }

        .command-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .command-input:focus {
            border-color: var(--accent-blue);
        }

        .execute-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-green), #2ea043);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .execute-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(63, 185, 80, 0.4);
        }

        .execute-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .clear-btn {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .help-panel {
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .help-panel.active {
            display: block;
        }

        .help-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--bg-panel);
        }

        .help-title {
            font-weight: 600;
            font-size: 16px;
        }

        .help-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .help-content {
            padding: 20px;
        }

        .help-section {
            margin-bottom: 20px;
        }

        .help-section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-purple);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .help-description {
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .help-usage {
            background: var(--bg-dark);
            padding: 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--accent-orange);
            margin-bottom: 12px;
        }

        .example-item {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .example-cmd {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--accent-green);
            margin-bottom: 4px;
        }

        .example-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .example-use-btn {
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--accent-blue);
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .example-use-btn:hover {
            background: #4a9eff;
        }

        .tip-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .tip-icon {
            color: var(--accent-orange);
            font-size: 14px;
        }

        .option-item {
            display: flex;
            gap: 12px;
            padding: 6px 0;
            font-size: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .option-flag {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-blue);
            min-width: 80px;
        }

        .option-desc {
            color: var(--text-secondary);
        }

        .running-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-input);
            border-radius: 20px;
            font-size: 13px;
        }

        .running-indicator.active {
            display: flex;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .help-text {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .help-text kbd {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }

        .history-panel {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            transition: right 0.3s;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .history-panel.active {
            right: 0;
        }

        .history-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-title {
            font-weight: 600;
            font-size: 14px;
        }

        .close-history {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .history-item {
            padding: 12px;
            background: var(--bg-input);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: var(--bg-dark);
        }

        .history-command {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--accent-green);
            margin-bottom: 4px;
        }

        .history-time {
            font-size: 11px;
            color: var(--text-secondary);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .search-box {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-text {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="logo-icon">🐉</span>
            <span class="logo-text">Kali Command Center</span>
        </div>
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span id="statusText">系统就绪</span>
            </div>
            <div class="running-indicator" id="runningIndicator">
                <div class="spinner"></div>
                <span>命令执行中...</span>
            </div>
            <button class="clear-btn" onclick="toggleHistory()">📜 历史</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="search-box">
                <input type="text" class="search-input" id="toolSearch" 
                       placeholder="🔍 搜索工具..." onkeyup="filterTools()">
            </div>
            
            <div class="sidebar-header">
                <span class="sidebar-title">⚡ 工具列表</span>
                <span class="tool-count" id="toolCount">0 个工具</span>
            </div>
            
            <div class="tools-list" id="toolsList">
                <div class="empty-state">
                    <div class="empty-icon">🔄</div>
                    <div class="empty-text">正在加载工具...</div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-area">
                <div class="terminal-section">
                    <div class="terminal-output" id="terminalOutput">
                        <div class="output-line info">
                            <span class="timestamp">[System]</span> 🔥 Kali Command Center 已启动
                        </div>
                        <div class="output-line info">
                            <span class="timestamp">[System]</span> ⚡ 正在检测已安装的工具...
                        </div>
                    </div>

                    <div class="input-area">
                        <div class="input-wrapper">
                            <span class="prompt">$</span>
                            <input type="text" class="command-input" id="commandInput" 
                                   placeholder="输入命令或点击左侧工具"
                                   onkeypress="handleKeyPress(event)">
                            <button class="execute-btn" id="executeBtn" onclick="executeCommand()">
                                执行
                            </button>
                            <button class="clear-btn" onclick="clearTerminal()">
                                清除
                            </button>
                        </div>
                        <div class="help-text">
                            💡 提示: <kbd>Enter</kbd> 执行 | <kbd>↑↓</kbd> 历史 | <kbd>Tab</kbd> 查看帮助 | <kbd>Ctrl+L</kbd> 清屏
                        </div>
                    </div>
                </div>

                <div class="help-panel" id="helpPanel">
                    <div class="help-header">
                        <span class="help-title" id="helpTitle">工具使用指南</span>
                        <button class="help-close" onclick="closeHelp()">×</button>
                    </div>
                    <div class="help-content" id="helpContent">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <span class="history-title">📜 执行历史</span>
            <button class="close-history" onclick="toggleHistory()">×</button>
        </div>
        <div class="history-list" id="historyList">
            <div class="empty-state">
                <div class="empty-icon">📭</div>
                <div class="empty-text">暂无历史记录</div>
            </div>
        </div>
    </div>

    <script>
        let commandHistory = [];
        let historyIndex = -1;
        let isExecuting = false;
        let detectedTools = {};
        let selectedTool = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadTools();
            loadHistory();
            document.getElementById('commandInput').focus();
        });

        async function loadTools() {
            try {
                document.getElementById('statusText').textContent = '检测工具中...';
                
                const response = await fetch('/tools');
                detectedTools = await response.json();
                
                let totalTools = 0;
                for (const category in detectedTools) {
                    totalTools += detectedTools[category].tools.length;
                }
                
                document.getElementById('toolCount').textContent = `${totalTools} 个工具`;
                renderTools(detectedTools);
                
                document.getElementById('statusText').textContent = `已加载 ${totalTools} 个工具`;
                
                addOutput(`<span class="timestamp">[System]</span> ✅ 检测到 ${totalTools} 个已安装的工具`, 'info');
                addOutput(`<span class="timestamp">[System]</span> 💡 点击左侧工具查看使用说明并执行`, 'info');
                
            } catch (error) {
                console.error('加载工具失败:', error);
                document.getElementById('statusText').textContent = '加载失败';
                addOutput(`<span class="timestamp">[System]</span> ❌ 工具加载失败: ${error.message}`, 'error');
            }
        }

        function renderTools(tools) {
            const toolsList = document.getElementById('toolsList');
            toolsList.innerHTML = '';

            for (const category in tools) {
                const categoryData = tools[category];
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'tool-category';
                categoryDiv.innerHTML = `
                    <div class="category-header" onclick="toggleCategory(this)">
                        <span class="category-icon">${categoryData.icon}</span>
                        <span class="category-name">${category}</span>
                        <span class="category-count">${categoryData.tools.length}</span>
                    </div>
                    <div class="category-description">${categoryData.description}</div>
                    <div class="tool-items">
                        ${categoryData.tools.map(tool => `
                            <div class="tool-item" data-tool='${JSON.stringify(tool).replace(/'/g, "&#39;")}' 
                                 onclick="selectTool(this, '${tool.key}')">
                                <div class="tool-name">${tool.name}</div>
                                <div class="tool-desc">${tool.description}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                toolsList.appendChild(categoryDiv);
            }
        }

        function toggleCategory(header) {
            const toolItems = header.nextElementSibling.nextElementSibling;
            if (toolItems.style.display === 'none') {
                toolItems.style.display = 'block';
            } else {
                toolItems.style.display = 'none';
            }
        }

        async function selectTool(element, toolKey) {
            document.querySelectorAll('.tool-item').forEach(item => {
                item.classList.remove('selected');
            });
            element.classList.add('selected');

            try {
                const response = await fetch(`/tools/${toolKey}`);
                const toolDetails = await response.json();
                
                selectedTool = toolDetails;
                showToolHelp(toolDetails);
                
            } catch (error) {
                console.error('获取工具详情失败:', error);
            }
        }

        function showToolHelp(tool) {
            const helpPanel = document.getElementById('helpPanel');
            const helpTitle = document.getElementById('helpTitle');
            const helpContent = document.getElementById('helpContent');
            
            helpTitle.textContent = `${tool.name} 使用指南`;
            
            let html = `
                <div class="help-section">
                    <div class="help-section-title">📝 工具简介</div>
                    <div class="help-description">${tool.description || '暂无描述'}</div>
                    
                    <div class="help-section-title">💻 基本用法</div>
                    <div class="help-usage">${tool.usage || tool.command}</div>
                </div>
            `;

            if (tool.examples && tool.examples.length > 0) {
                html += `
                    <div class="help-section">
                        <div class="help-section-title">📋 使用示例</div>
                        ${tool.examples.map(ex => `
                            <div class="example-item">
                                <div class="example-cmd">${ex.cmd}</div>
                                <div class="example-desc">${ex.desc}</div>
                                <button class="example-use-btn" onclick="useExample('${ex.cmd.replace(/'/g, "\\'")}')">
                                    ▶ 使用此命令
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (tool.tips && tool.tips.length > 0) {
                html += `
                    <div class="help-section">
                        <div class="help-section-title">💡 使用技巧</div>
                        ${tool.tips.map(tip => `
                            <div class="tip-item">
                                <span class="tip-icon">▸</span>
                                <span>${tip}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (tool.common_options && Object.keys(tool.common_options).length > 0) {
                html += `
                    <div class="help-section">
                        <div class="help-section-title">🔧 常用选项</div>
                        ${Object.entries(tool.common_options).map(([flag, desc]) => `
                            <div class="option-item">
                                <span class="option-flag">${flag}</span>
                                <span class="option-desc">${desc}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            html += `
                <div class="help-section">
                    <button class="execute-btn" onclick="useTool('${tool.command.replace(/'/g, "\\'")}')" style="width: 100%;">
                        ▶ 执行 ${tool.name}
                    </button>
                </div>
            `;

            helpContent.innerHTML = html;
            helpPanel.classList.add('active');
        }

        function useTool(command) {
            document.getElementById('commandInput').value = command;
            executeCommand();
        }

        function useExample(command) {
            document.getElementById('commandInput').value = command;
            executeCommand();
        }

        function closeHelp() {
            document.getElementById('helpPanel').classList.remove('active');
        }

        function filterTools() {
            const searchTerm = document.getElementById('toolSearch').value.toLowerCase();
            
            document.querySelectorAll('.tool-item').forEach(item => {
                const toolData = JSON.parse(item.dataset.tool.replace(/&#39;/g, "'"));
                const matches = toolData.name.toLowerCase().includes(searchTerm) ||
                               toolData.description.toLowerCase().includes(searchTerm) ||
                               toolData.key.toLowerCase().includes(searchTerm);
                item.style.display = matches ? 'block' : 'none';
            });

            document.querySelectorAll('.tool-category').forEach(category => {
                const hasVisibleTools = category.querySelectorAll('.tool-item[style="display: block"], .tool-item:not([style])').length > 0;
                category.style.display = hasVisibleTools ? 'block' : 'none';
            });
        }

        async function loadHistory() {
            try {
                const response = await fetch('/history');
                commandHistory = await response.json();
                updateHistoryPanel();
            } catch (error) {
                console.error('加载历史失败:', error);
            }
        }

        function updateHistoryPanel() {
            const historyList = document.getElementById('historyList');
            
            if (commandHistory.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div class="empty-text">暂无历史记录</div>
                    </div>
                `;
                return;
            }

            historyList.innerHTML = commandHistory.reverse().slice(0, 20).map(item => {
                const time = new Date(item.timestamp).toLocaleString('zh-CN');
                const statusIcon = item.status === 'completed' ? '✅' : item.status === 'error' ? '❌' : '⏳';
                return `
                    <div class="history-item" onclick="useHistoryCommand('${item.command.replace(/'/g, "\\'")}')">
                        <div class="history-command">${statusIcon} ${escapeHtml(item.command)}</div>
                        <div class="history-time">${time}</div>
                    </div>
                `;
            }).join('');
        }

        function useHistoryCommand(command) {
            document.getElementById('commandInput').value = command;
            document.getElementById('commandInput').focus();
            toggleHistory();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function executeCommand() {
            if (isExecuting) return;

            const commandInput = document.getElementById('commandInput');
            const command = commandInput.value.trim();

            if (!command) return;

            isExecuting = true;
            updateUI(true);

            const timestamp = new Date().toLocaleTimeString('zh-CN');
            const terminalOutput = document.getElementById('terminalOutput');

            addOutput(`<span class="timestamp">[${timestamp}]</span> <span class="command">$ ${escapeHtml(command)}</span>`, 'command');

            commandHistory.push({
                command: command,
                timestamp: new Date().toISOString(),
                status: 'running'
            });

            try {
                const response = await fetch('/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ command: command })
                });

                if (!response.ok) {
                    throw new Error('命令执行失败');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split('\n');

                    lines.forEach(line => {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                if (data.type === 'output') {
                                    addOutput(escapeHtml(data.data), '');
                                } else if (data.type === 'status') {
                                    if (data.status === 'completed') {
                                        addOutput(`\n<span class="info">[命令完成，退出码: ${data.exit_code}]</span>`, 'info');
                                    } else if (data.status === 'error') {
                                        addOutput(`\n<span class="error">[错误: ${data.error}]</span>`, 'error');
                                    }
                                }
                            } catch (e) {
                            }
                        }
                    });
                }
            } catch (error) {
                addOutput(`\n<span class="error">[连接错误: ${error.message}]</span>`, 'error');
            } finally {
                isExecuting = false;
                updateUI(false);
                loadHistory();
                commandInput.value = '';
            }
        }

        function addOutput(text, className) {
            const terminalOutput = document.getElementById('terminalOutput');
            const line = document.createElement('div');
            line.className = 'output-line ' + className;
            line.innerHTML = text;
            terminalOutput.appendChild(line);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        function updateUI(running) {
            const executeBtn = document.getElementById('executeBtn');
            const runningIndicator = document.getElementById('runningIndicator');
            const commandInput = document.getElementById('commandInput');

            executeBtn.disabled = running;
            commandInput.disabled = running;
            runningIndicator.classList.toggle('active', running);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                executeCommand();
            } else if (event.key === 'ArrowUp') {
                navigateHistory(-1);
            } else if (event.key === 'ArrowDown') {
                navigateHistory(1);
            } else if (event.key === 'Tab') {
                event.preventDefault();
                if (selectedTool) {
                    showToolHelp(selectedTool);
                }
            }
        }

        function navigateHistory(direction) {
            if (commandHistory.length === 0) return;

            historyIndex += direction;

            if (historyIndex < 0) {
                historyIndex = 0;
            } else if (historyIndex >= commandHistory.length) {
                historyIndex = commandHistory.length - 1;
                return;
            }

            const commandInput = document.getElementById('commandInput');
            commandInput.value = commandHistory[commandHistory.length - 1 - historyIndex].command;
        }

        function toggleHistory() {
            const historyPanel = document.getElementById('historyPanel');
            historyPanel.classList.toggle('active');
        }

        function clearTerminal() {
            const terminalOutput = document.getElementById('terminalOutput');
            terminalOutput.innerHTML = `
                <div class="output-line info">
                    <span class="timestamp">[System]</span> ✓ 终端已清空
                </div>
            `;
        }

        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'l') {
                event.preventDefault();
                clearTerminal();
            }
        });
    </script>
</body>
</html>
