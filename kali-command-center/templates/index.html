<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kali Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-panel: #161b22;
            --bg-input: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-green: #3fb950;
            --accent-blue: #58a6ff;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 28px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-bar {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tools-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .tool-category {
            margin-bottom: 16px;
        }

        .category-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-purple);
            text-transform: uppercase;
            padding: 8px 8px 4px;
            letter-spacing: 0.5px;
        }

        .tool-btn {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            margin-bottom: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn:hover {
            background: var(--bg-dark);
            border-color: var(--accent-blue);
            transform: translateX(4px);
        }

        .tool-icon {
            font-size: 16px;
            opacity: 0.8;
        }

        /* Terminal Area */
        .terminal-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal-output {
            flex: 1;
            background: #0a0e14;
            padding: 20px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            border-bottom: 1px solid var(--border-color);
        }

        .output-line {
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 2px;
        }

        .output-line.command {
            color: var(--accent-green);
        }

        .output-line.error {
            color: var(--accent-red);
        }

        .output-line.info {
            color: var(--accent-blue);
        }

        .output-line.warning {
            color: var(--accent-orange);
        }

        .timestamp {
            color: var(--text-secondary);
            font-size: 11px;
        }

        /* Input Area */
        .input-area {
            background: var(--bg-panel);
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .prompt {
            color: var(--accent-green);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
        }

        .command-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .command-input:focus {
            border-color: var(--accent-blue);
        }

        .command-input::placeholder {
            color: var(--text-secondary);
        }

        .execute-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-green), #2ea043);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .execute-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(63, 185, 80, 0.4);
        }

        .execute-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .clear-btn {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        /* History Panel */
        .history-panel {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            transition: right 0.3s;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .history-panel.active {
            right: 0;
        }

        .history-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-title {
            font-weight: 600;
            font-size: 14px;
        }

        .close-history {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .history-item {
            padding: 12px;
            background: var(--bg-input);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: var(--bg-dark);
        }

        .history-command {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--accent-green);
            margin-bottom: 4px;
        }

        .history-time {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Status Indicator */
        .running-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-input);
            border-radius: 20px;
            font-size: 13px;
        }

        .running-indicator.active {
            display: flex;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Help Text */
        .help-text {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .help-text kbd {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 220px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="logo-icon">🐉</span>
            <span class="logo-text">Kali Command Center</span>
        </div>
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>在线</span>
            </div>
            <div class="running-indicator" id="runningIndicator">
                <div class="spinner"></div>
                <span>命令执行中...</span>
            </div>
            <button class="clear-btn" onclick="toggleHistory()">📜 历史</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-header">⚡ 快速工具</div>
            <div class="tools-list" id="toolsList">
                <div style="padding: 20px; text-align: center; color: var(--text-secondary);">
                    加载中...
                </div>
            </div>
        </aside>

        <main class="terminal-area">
            <div class="terminal-output" id="terminalOutput">
                <div class="output-line info">
                    <span class="timestamp">[System]</span> 🔥 Kali Command Center 已启动
                </div>
                <div class="output-line info">
                    <span class="timestamp">[System]</span> ✓ 服务正常运行，等待命令输入...
                </div>
                <div class="output-line info">
                    <span class="timestamp">[System]</span> 💡 提示：使用上方快捷工具或直接输入命令
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <span class="prompt">$</span>
                    <input type="text" class="command-input" id="commandInput" 
                           placeholder="输入命令，例如: nmap -sV 192.168.1.1"
                           onkeypress="handleKeyPress(event)">
                    <button class="execute-btn" id="executeBtn" onclick="executeCommand()">
                        执行
                    </button>
                    <button class="clear-btn" onclick="clearTerminal()">
                        清除
                    </button>
                </div>
                <div class="help-text">
                    💡 快捷键: <kbd>Enter</kbd> 执行命令 | <kbd>Ctrl+L</kbd> 清屏 | <kbd>↑</kbd><kbd>↓</kbd> 历史命令
                </div>
            </div>
        </main>
    </div>

    <!-- History Panel -->
    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <span class="history-title">📜 执行历史</span>
            <button class="close-history" onclick="toggleHistory()">×</button>
        </div>
        <div class="history-list" id="historyList">
            <div style="padding: 20px; text-align: center; color: var(--text-secondary);">
                暂无历史记录
            </div>
        </div>
    </div>

    <script>
        let commandHistory = [];
        let historyIndex = -1;
        let isExecuting = false;
        let currentEventSource = null;

        // 页面加载完成后
        document.addEventListener('DOMContentLoaded', function() {
            loadTools();
            loadHistory();
            
            // 聚焦到输入框
            document.getElementById('commandInput').focus();
        });

        // 加载工具列表
        async function loadTools() {
            try {
                const response = await fetch('/tools');
                const tools = await response.json();
                
                const groupedTools = {};
                tools.forEach(tool => {
                    if (!groupedTools[tool.category]) {
                        groupedTools[tool.category] = [];
                    }
                    groupedTools[tool.category].push(tool);
                });

                const toolsList = document.getElementById('toolsList');
                toolsList.innerHTML = '';

                Object.keys(groupedTools).forEach(category => {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'tool-category';
                    categoryDiv.innerHTML = `
                        <div class="category-title">${category}</div>
                        ${groupedTools[category].map(tool => `
                            <button class="tool-btn" onclick="executeTool('${tool.name}', '${tool.command}')">
                                <span class="tool-icon">▶</span>
                                <span>${tool.name}</span>
                            </button>
                        `).join('')}
                    `;
                    toolsList.appendChild(categoryDiv);
                });
            } catch (error) {
                console.error('加载工具失败:', error);
            }
        }

        // 加载历史记录
        async function loadHistory() {
            try {
                const response = await fetch('/history');
                commandHistory = await response.json();
                updateHistoryPanel();
            } catch (error) {
                console.error('加载历史失败:', error);
            }
        }

        // 更新历史面板
        function updateHistoryPanel() {
            const historyList = document.getElementById('historyList');
            
            if (commandHistory.length === 0) {
                historyList.innerHTML = `
                    <div style="padding: 20px; text-align: center; color: var(--text-secondary);">
                        暂无历史记录
                    </div>
                `;
                return;
            }

            historyList.innerHTML = commandHistory.reverse().slice(0, 20).map(item => {
                const time = new Date(item.timestamp).toLocaleString('zh-CN');
                const statusClass = item.status === 'completed' ? '✓' : item.status === 'error' ? '✗' : '...';
                return `
                    <div class="history-item" onclick="useHistoryCommand('${item.command.replace(/'/g, "\\'")}')">
                        <div class="history-command">${statusClass} ${escapeHtml(item.command)}</div>
                        <div class="history-time">${time}</div>
                    </div>
                `;
            }).join('');
        }

        // 使用历史命令
        function useHistoryCommand(command) {
            document.getElementById('commandInput').value = command;
            document.getElementById('commandInput').focus();
            toggleHistory();
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 执行工具
        function executeTool(name, command) {
            document.getElementById('commandInput').value = command;
            executeCommand();
        }

        // 执行命令
        async function executeCommand() {
            if (isExecuting) return;

            const commandInput = document.getElementById('commandInput');
            const command = commandInput.value.trim();

            if (!command) return;

            isExecuting = true;
            updateUI(true);

            const timestamp = new Date().toLocaleTimeString('zh-CN');
            const terminalOutput = document.getElementById('terminalOutput');

            // 添加命令到输出
            addOutput(`<span class="timestamp">[${timestamp}]</span> <span class="command">$ ${escapeHtml(command)}</span>`, 'command');

            // 添加到历史
            commandHistory.push({
                command: command,
                timestamp: new Date().toISOString(),
                status: 'running'
            });

            try {
                const response = await fetch('/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ command: command })
                });

                if (!response.ok) {
                    throw new Error('命令执行失败');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split('\n');

                    lines.forEach(line => {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                if (data.type === 'output') {
                                    addOutput(escapeHtml(data.data), '');
                                } else if (data.type === 'status') {
                                    if (data.status === 'completed') {
                                        addOutput(`\n<span class="info">[命令完成，退出码: ${data.exit_code}]</span>`, 'info');
                                    } else if (data.status === 'error') {
                                        addOutput(`\n<span class="error">[错误: ${data.error}]</span>`, 'error');
                                    }
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    });
                }
            } catch (error) {
                addOutput(`\n<span class="error">[连接错误: ${error.message}]</span>`, 'error');
            } finally {
                isExecuting = false;
                updateUI(false);
                loadHistory();
                commandInput.value = '';
            }
        }

        // 添加输出
        function addOutput(text, className) {
            const terminalOutput = document.getElementById('terminalOutput');
            const line = document.createElement('div');
            line.className = 'output-line ' + className;
            line.innerHTML = text;
            terminalOutput.appendChild(line);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        // 更新UI状态
        function updateUI(running) {
            const executeBtn = document.getElementById('executeBtn');
            const runningIndicator = document.getElementById('runningIndicator');
            const commandInput = document.getElementById('commandInput');

            executeBtn.disabled = running;
            commandInput.disabled = running;
            runningIndicator.classList.toggle('active', running);
        }

        // 处理键盘事件
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                executeCommand();
            } else if (event.key === 'ArrowUp') {
                navigateHistory(-1);
            } else if (event.key === 'ArrowDown') {
                navigateHistory(1);
            } else if (event.ctrlKey && event.key === 'l') {
                event.preventDefault();
                clearTerminal();
            }
        }

        // 浏览历史命令
        function navigateHistory(direction) {
            if (commandHistory.length === 0) return;

            historyIndex += direction;

            if (historyIndex < 0) {
                historyIndex = 0;
            } else if (historyIndex >= commandHistory.length) {
                historyIndex = commandHistory.length - 1;
                return;
            }

            const commandInput = document.getElementById('commandInput');
            commandInput.value = commandHistory[commandHistory.length - 1 - historyIndex].command;
        }

        // 切换历史面板
        function toggleHistory() {
            const historyPanel = document.getElementById('historyPanel');
            historyPanel.classList.toggle('active');
        }

        // 清空终端
        function clearTerminal() {
            const terminalOutput = document.getElementById('terminalOutput');
            terminalOutput.innerHTML = `
                <div class="output-line info">
                    <span class="timestamp">[System]</span> ✓ 终端已清空
                </div>
            `;
        }

        // 快捷键监听
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'l') {
                event.preventDefault();
                clearTerminal();
            }
        });
    </script>
</body>
</html>
